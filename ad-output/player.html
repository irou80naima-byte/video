<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<title>الإعلان — حفيظ المكتوب</title>
<style>
:root{--bg:#0E1116;--ink:#F7F8FA;--acc:#FF7A1A;--mut:#9AA3AE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;
display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:22px}
h1{font-weight:900;font-size:30px;margin:0}
p{color:var(--mut);margin:0;font-size:16px}
video{width:min(340px,86vw);border-radius:22px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6)}
a.btn,button{font-family:inherit;font-weight:900;font-size:19px;border:0;cursor:pointer;
background:var(--acc);color:#0E1116;padding:16px 34px;border-radius:999px;text-decoration:none;display:inline-block}
a.sec{background:transparent;color:var(--acc);border:2px solid var(--acc);font-weight:700;font-size:16px;padding:12px 26px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#s{color:var(--mut);font-size:15px}
</style></head><body>
<h1>الإعلان جاهز</h1>
<p id="s">جاري تحضير الفيديو…</p>
<video id="v" controls playsinline></video>
<div class="row">
  <a class="btn" id="dl" download="ad-master.mp4">تنزيل الفيديو MP4</a>
</div>
<div class="row">
  <a class="sec" href="ad-master.srt" download>ملف الترجمة SRT</a>
  <a class="sec" href="caption.txt" download>نص البوست</a>
</div>
<script>
const B='ad-master.mp4.b64.txt';
fetch(B).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
.then(t=>{
  const b=atob(t.replace(/\s/g,''));
  const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:'video/mp4'}));
  document.getElementById('v').src=url;
  document.getElementById('dl').href=url;
  document.getElementById('s').textContent='١٤.٤ ثانية · 1080×1920 · 2.4 ميقا — اضغط زر التنزيل';
})
.catch(e=>{document.getElementById('s').textContent='ما قدرت أحمّل الفيديو: '+e.message;});
</script></body></html>
